name: Capture TacticLens judge demo
on:
  push:
    branches: [main]
    paths:
      - web/src/NewUserTour.tsx
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Prepare Chromium and video capture
        run: |
          npx playwright install --with-deps chromium ffmpeg
      - name: Verify live deployment and record seed 82
        run: |
          node --experimental-strip-types scripts/check-production.mjs --record
      - name: Upload silent demo recording, screenshots and evidence files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TacticLens-demo-silent-video
          path: web/test-results/production/
          if-no-files-found: warn
          retention-days: 20
