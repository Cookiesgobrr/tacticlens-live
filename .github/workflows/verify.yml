name: Verify TacticLens
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
# Only the latest update to a PR needs validating; avoid queued stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest api/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --experimental-strip-types scripts/check-match.mjs
      - run: npm run test:match -- --holdout
      - run: npm run test:formations
      - run: npm run test:highlights
      - run: npm run test:camera
      - run: npm run test:analysis
      - run: npm run test:evidence
      - run: npm run test:intelligence
      - run: npm run test:editorial
      - run: npm run test:live
      - name: Build offline session fixtures
        working-directory: .
        run: python3 -m unittest api.tests.test_live_sessions -q
      - run: npm run test:sessions
      - run: npm run build
      - name: Prepare browser
        timeout-minutes: 10
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            "$browser_path" --version
            echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:browser
      - run: npm run test:live-browser
      - run: npm run test:tour
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-browser-review
          path: web/test-results


  sessions-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Prepare browser
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:session-browser
        env:
          PYTHON: python3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-browser-review
          path: web/test-results/session
