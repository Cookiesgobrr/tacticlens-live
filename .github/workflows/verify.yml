name: Verify TacticLens
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
# Only the latest update to a PR needs validating; avoid queued stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r api/requirements.txt
      - run: python -m pytest api/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --experimental-strip-types scripts/check-match.mjs
      - run: npm run test:match -- --holdout
      - run: npm run test:analysis
      - run: npm run test:evidence
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-browser-review
          path: web/test-results

