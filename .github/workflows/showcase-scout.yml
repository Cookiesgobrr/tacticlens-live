name: Scoreline Showcase Scout
on:
  push:
    branches: [feature/goal-rich-judge-showcase]
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --experimental-strip-types scripts/select-showcase.mjs
